name: app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${NITRO_DRIZZLE_CONNECTION_USER:-user}
      POSTGRES_PASSWORD: ${NITRO_DRIZZLE_CONNECTION_PASSWORD:-passwd}
      POSTGRES_DB: ${NITRO_DRIZZLE_CONNECTION_DATABASE:-mydb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: migrate
    environment:
      NITRO_DRIZZLE_CONNECTION_USER: ${NITRO_DRIZZLE_CONNECTION_USER:-user}
      NITRO_DRIZZLE_CONNECTION_PASSWORD: ${NITRO_DRIZZLE_CONNECTION_PASSWORD:-passwd}
      NITRO_DRIZZLE_CONNECTION_HOST: postgres
      NITRO_DRIZZLE_CONNECTION_PORT: '5432'
      NITRO_DRIZZLE_CONNECTION_DATABASE: ${NITRO_DRIZZLE_CONNECTION_DATABASE:-mydb}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: runtime
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NITRO_DRIZZLE_CONNECTION_USER: ${NITRO_DRIZZLE_CONNECTION_USER:-user}
      NITRO_DRIZZLE_CONNECTION_PASSWORD: ${NITRO_DRIZZLE_CONNECTION_PASSWORD:-passwd}
      NITRO_DRIZZLE_CONNECTION_HOST: postgres
      NITRO_DRIZZLE_CONNECTION_PORT: '5432'
      NITRO_DRIZZLE_CONNECTION_DATABASE: ${NITRO_DRIZZLE_CONNECTION_DATABASE:-mydb}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${APP_ORIGIN:-http://localhost:3000}
      BETTER_AUTH_TRUSTED_ORIGINS: ${APP_ORIGIN:-http://localhost:3000}
      BETTER_AUTH_ALLOWED_HOSTS: ${BETTER_AUTH_ALLOWED_HOSTS:-localhost,localhost:*}
      HOST: 0.0.0.0
      PORT: '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
