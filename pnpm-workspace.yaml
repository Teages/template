minimumReleaseAge: 0
shellEmulator: true
trustPolicy: no-downgrade
packages:
  - frontend
  - backend
trustPolicyIgnoreAfter: 4320
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
sharedWorkspaceLockfile: false

patchedDependencies:
  '@better-auth/drizzle-adapter@1.6.14': patches/@better-auth__drizzle-adapter.patch
  auth@1.6.14: patches/auth.patch
allowUnusedPatches: true
