minimumReleaseAge: 0
shellEmulator: true
trustPolicy: no-downgrade
packages:
  - frontend
  - backend
trustPolicyIgnoreAfter: 4320
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
sharedWorkspaceLockfile: false
patchedDependencies:
  '@nuxt/icon': patches/@nuxt__icon.patch
  '@nuxt/test-utils@4.0.3': patches/@nuxt__test-utils@4.0.3.patch
allowUnusedPatches: true
