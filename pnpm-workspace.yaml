ignoreWorkspaceRootCheck: true

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@vitejs/plugin-vue@6.0.11'

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - playground
  - playground-nuxt

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
