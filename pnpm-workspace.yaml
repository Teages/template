sharedWorkspaceLockfile: false
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320
# seroval@1.7.2 trips the no-downgrade heuristic, but was manually audited
# (2026-10-27): the diff vs 1.7.1 is a single-line fix from the verified
# upstream commit 737afa10e5 (always attach .catch to deserialized promises).
trustPolicyExclude:
  - seroval@1.7.2

shellEmulator: true

skills:
  dirs:
    - .agents/skills

overrides:
  '@nuxt/nitro-server': 'npm:@nuxt/nitro-server-nightly@5.0.0-2610281032-c0c2b8f'
  nitro: 'npm:nitro-nightly@3.0.1-20261028-065025-1a9a371c'
  nuxt: 'npm:nuxt-nightly@5.0.0-2610281032-c0c2b8f'

patchedDependencies:
  '@nuxt/test-utils@4.3.4': patches/@nuxt__test-utils@4.3.4.patch
  nitro-nightly@3.0.1-20261028-065025-1a9a371c: patches/nitro-nightly@3.0.1-20261028-065025-1a9a371c.patch

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
