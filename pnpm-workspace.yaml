minimumReleaseAge: 0
shellEmulator: true
trustPolicy: no-downgrade
packages:
  - frontend
trustPolicyIgnoreAfter: 4320
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
sharedWorkspaceLockfile: false
patchedDependencies:
  '@better-auth/kysely-adapter@1.7.0-rc.1': patches/@better-auth__kysely-adapter@1.7.0-rc.1.patch
  '@nuxt/icon': patches/@nuxt__icon.patch
  '@nuxt/test-utils@4.0.3': patches/@nuxt__test-utils@4.0.3.patch
allowUnusedPatches: true
