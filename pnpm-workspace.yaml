sharedWorkspaceLockfile: false
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320
# seroval@1.7.2+ are staged releases pending author approval; 1.7.1 is the
# last release published from the GitHub repo. Force it until 1.7.2 ships.
trustPolicyExclude:
  - seroval@1.7.1

shellEmulator: true

overrides:
  seroval: 1.7.1

patchedDependencies:
  '@nuxt/test-utils@4.3.4': patches/@nuxt__test-utils@4.3.4.patch
  nitro@3.0.260903-beta: patches/nitro@3.0.260903-beta.patch

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
